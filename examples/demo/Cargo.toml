[package]
name = "demo"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
default-run = "demo-cli"

[dependencies]
loco-rs = { version = "1.2", default-features = false, features = ["cli"] }
loco-inertia = { path = "../../crates/loco-inertia" }
async-trait = "0.1"
axum = { workspace = true }
validator = { version = "0.20", features = ["derive"] }
ts-rs = "12"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = "0.1"

[dev-dependencies]
axum-test = "17.3.0"
loco-rs = { version = "1.2", default-features = false, features = ["cli", "testing"] }
serde_json = { workspace = true }

[[bin]]
name = "demo-cli"
path = "src/bin/main.rs"
