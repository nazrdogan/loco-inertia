[workspace]
resolver = "2"
members = ["crates/inertia-axum", "crates/loco-inertia", "examples/demo"]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.2"
repository = "https://github.com/nazrdogan/loco-inertia"

[workspace.dependencies]
axum = "0.8"
http = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tera = "1"
