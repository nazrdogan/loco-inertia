[package]
name = "inertia-axum"
description = "Inertia.js v3 server-side protocol for axum: props, partial reloads, flash, CSRF, SSR"
readme = "README.md"
keywords = ["inertia", "inertiajs", "axum", "spa", "ssr"]
categories = ["web-programming", "web-programming::http-server"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
axum = { workspace = true }
http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = "0.1"
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
axum-extra = { version = "0.10", features = ["cookie-private", "cookie-signed"], optional = true }
getrandom = { version = "0.3", optional = true }
subtle = { version = "2.6", optional = true }
ts-rs = { version = "12", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json"], optional = true }

[features]
default = []
# Encrypted-cookie store for flash data and validation errors.
cookie-flash = ["dep:axum-extra"]
# XSRF-TOKEN double-submit protection for unsafe requests.
csrf = ["dep:axum-extra", "dep:getrandom", "dep:subtle"]
# HTTP client for the Node SSR server.
ssr = ["dep:reqwest"]
# `ts_rs::TS` for the wire types (e.g. `ScrollData<T>`).
ts = ["dep:ts-rs"]

[dev-dependencies]
tokio = { workspace = true, features = ["net", "time"] }
tower = { workspace = true }
http-body-util = { workspace = true }
ts-rs = "12"
axum-extra = { version = "0.10", features = ["cookie-signed"] }
