[package]
name = "loco-inertia"
description = "Inertia.js v3 adapter for Loco.rs: typed pages, forms, Vite, SSR"
readme = "../../README.md"
keywords = ["inertia", "inertiajs", "loco", "axum", "ssr"]
categories = ["web-programming", "web-programming::http-server"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
inertia-axum = { path = "../inertia-axum", version = "0.1.1", features = ["cookie-flash", "csrf", "ssr"] }
loco-rs = { version = "1.2", default-features = false }
axum = { workspace = true, features = ["multipart"] }
form_urlencoded = "1"
serde = { workspace = true }
serde_json = { workspace = true }
tera = { workspace = true }
async-trait = "0.1"
tracing = "0.1"
rrgen = "0.6"
validator = "0.20"

[dev-dependencies]
validator = { version = "0.20", features = ["derive"] }
tokio = { workspace = true }
tower = { workspace = true }
http-body-util = { workspace = true }
proptest = "1"
form_urlencoded = "1"

[features]
default = ["ts"]
# `ts_rs::TS` on wire types such as `ScrollData<T>`.
ts = ["inertia-axum/ts"]
